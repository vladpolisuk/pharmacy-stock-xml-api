<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка XML API — склад лекарств</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Проверка XML API</h1>
    </header>

    <section class="panel" aria-labelledby="request-heading">
      <h2 id="request-heading"><span class="step">1</span> Сформировать GET-запрос</h2>
      <form id="filters" novalidate autocomplete="off">
        <div class="filter-grid">
          <label>Идентификатор остатка<input name="balance_id" inputmode="numeric" placeholder="Например, 1"><span>balance_id · точное совпадение</span></label>
          <label>Название препарата<input name="drug_name" placeholder="Например, препарат"><span>drug_name · содержит текст</span></label>
          <label>Номер партии<input name="batch_number" placeholder="Например, 00021-A"><span>batch_number · точное совпадение</span></label>
          <label>Температура хранения<input name="storage_temperature" placeholder="Например, +2…+8 °C"><span>storage_temperature · точное совпадение</span></label>
          <label>Минимальное количество<input name="min_quantity" inputmode="numeric" placeholder="От 0"><span>min_quantity · включая границу</span></label>
          <label>Максимальное количество<input name="max_quantity" inputmode="numeric" placeholder="Например, 100"><span>max_quantity · включая границу</span></label>
          <label>Срок годности с<input name="expiry_after" placeholder="YYYY-MM-DD"><span>expiry_after · включая дату</span></label>
          <label>Срок годности по<input name="expiry_before" placeholder="YYYY-MM-DD"><span>expiry_before · включая дату</span></label>
        </div>
        <label class="checkbox"><input type="checkbox" name="download" value="1"> Добавить download=1 — проверить ответ для скачивания XML</label>
        <div class="actions">
          <button type="submit" id="send">Выполнить GET</button>
          <button type="button" id="clear" class="secondary">Сбросить фильтры</button>
        </div>
      </form>

      <h3 class="examples-heading" id="examples-heading">Примеры:</h3>
      <div class="examples" aria-labelledby="examples-heading">
        <button type="button" data-example="all" aria-pressed="true">Все записи</button>
        <button type="button" data-example="first" aria-pressed="false">ID 1</button>
        <button type="button" data-example="second" aria-pressed="false">ID 2</button>
        <button type="button" data-example="combined" aria-pressed="false">Два фильтра</button>
        <button type="button" data-example="empty" aria-pressed="false">Нет совпадений</button>
        <button type="button" data-example="invalid" aria-pressed="false">Ошибка 400</button>
        <button type="button" data-example="export" aria-pressed="false">Экспорт XML</button>
      </div>

    </section>

    <section class="panel" aria-labelledby="response-heading" id="response-panel" aria-busy="false">
      <div class="section-title"><h2 id="response-heading"><span class="step">2</span> Ответ сервера</h2><span class="http-status" id="http-status">Ожидание</span></div>
      <div class="request-box">
        <div class="request-line"><span class="method">GET</span><code id="request-url"></code></div>
        <p id="request-hint" hidden></p>
        <div class="request-links"><a id="open-xml" href="/api/stock" target="_blank" rel="noopener">Открыть XML отдельно ↗</a><a id="download-xml" href="/api/stock?download=1">Скачать XML</a></div>
      </div>
      <div class="response-toolbar">
        <p id="status" role="status" aria-live="polite">Записей: —</p>
        <div class="response-tabs" role="tablist" aria-label="Представление ответа">
          <button type="button" id="tab-xml" role="tab" data-response-view="xml" aria-controls="xml-view" aria-selected="true" tabindex="0">XML</button>
          <button type="button" id="tab-table" role="tab" data-response-view="table" aria-controls="table-view" aria-selected="false" tabindex="-1">View</button>
        </div>
      </div>
      <div id="xml-view" role="tabpanel" aria-labelledby="tab-xml">
        <pre id="response-body" tabindex="0">—</pre>
      </div>
      <div id="table-view" role="tabpanel" aria-labelledby="tab-table" tabindex="0" hidden>
        <p id="view-message" class="view-message" role="status" hidden></p>
        <div class="table-scroll" id="view-table">
          <table>
            <caption class="sr-only">Остатки, полученные в последнем ответе API</caption>
            <thead><tr><th scope="col">ID</th><th scope="col">Название препарата</th><th scope="col">Номер партии</th><th scope="col">Срок годности</th><th scope="col">Количество</th><th scope="col">Температура хранения</th></tr></thead>
            <tbody id="stock"></tbody>
          </table>
        </div>
      </div>
      <details class="headers-disclosure">
        <summary>Заголовки ответа</summary>
        <pre id="response-headers" tabindex="0">—</pre>
      </details>
    </section>
    <noscript>Для выполнения запросов на этой странице включите JavaScript. Сам XML доступен по адресу /api/stock.</noscript>
  </main>
</body>
</html>
